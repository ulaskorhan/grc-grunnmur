# Every third day: compare the cyber risk level on the site with NSM's news feed.
# See check_cyber_level.py. In short:
#   - nothing new from NSM -> "sist kontrollert" gets today's date, and the site is rebuilt
#   - a new announcement   -> an issue is opened, and the level is updated by hand
name: Check NSM cyber risk level

on:
  schedule:
    - cron: "0 5 */3 * *"     # 05:00 UTC on day 1, 4, 7, ... of each month
  workflow_dispatch:          # the "Run workflow" button on GitHub, for a check by hand

permissions:
  contents: write             # to commit the new date and the rebuilt site
  issues: write               # to open an issue when NSM has published something new

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Read NSM's news feed
        run: python check_cyber_level.py "$RUNNER_TEMP/news.md"

      - name: Open an issue if NSM has published something new (only once)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/news.md" ] || exit 0
          title="NSM har publisert noe nytt om cyberrisikonivået"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq length)
          if [ "$open" = "0" ]; then
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/news.md"
          fi

      - name: Rebuild and publish the site with the new date
        run: |
          git diff --quiet cyber_level.py && exit 0     # nothing changed
          python build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cyber_level.py docs
          git commit -m "Check cyber risk level against NSM's news feed"
          git pull --rebase
          git push
